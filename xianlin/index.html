<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PDF预览 - 使用 PDF.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #525659;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            background: #3c3f41;
            color: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #2b2d2f;
        }
        .title {
            font-size: 1rem;
            font-weight: 500;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        button {
            background: #5a5e62;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #767b80;
        }
        .pdf-container {
            flex: 1;
            overflow: auto;
            background: #3c3f41;
            display: flex;
            justify-content: center;
        }
        canvas {
            margin: 0 auto;
            display: block;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            background: white;
        }
        .page-container {
            margin: 20px auto;
            position: relative;
        }
        .loading {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 1.2rem;
        }
        @media (max-width: 600px) {
            .toolbar { padding: 6px 12px; }
            button { padding: 3px 8px; font-size: 0.75rem; }
        }
    </style>
    <!-- 引入 PDF.js 核心库和 worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // 设置 worker 路径（使用 CDN）
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body>
<div class="toolbar">
    <div class="title">📄 正在预览：<strong>xianlin.pdf</strong> (PDF.js 渲染)</div>
    <div class="controls">
        <button id="prevPage">◀ 上一页</button>
        <span id="pageNum" style="color:white; font-size:0.9rem;">第 1 页</span>
        <button id="nextPage">下一页 ▶</button>
        <button id="refreshBtn">⟳ 刷新</button>
        <button id="fullscreenBtn">⤢ 全屏</button>
    </div>
</div>
<div class="pdf-container" id="pdfContainer">
    <div class="loading" id="loadingMsg">正在加载 PDF 文件，请稍候...</div>
    <div id="canvasContainer" style="display: none;"></div>
</div>

<script>
    (function() {
        // PDF 文件路径（当前目录下的 xianlin.pdf）
        const pdfUrl = 'xianlin.pdf';
        
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let renderTask = null;
        
        const container = document.getElementById('canvasContainer');
        const loadingMsg = document.getElementById('loadingMsg');
        const pageNumSpan = document.getElementById('pageNum');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const refreshBtn = document.getElementById('refreshBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // 渲染指定页面
        function renderPage(num) {
            if (!pdfDoc) return;
            // 取消之前的渲染任务
            if (renderTask) {
                renderTask.cancel();
            }
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 }); // 缩放比例，可根据屏幕宽度调整
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                // 清空容器并添加新 canvas
                container.innerHTML = '';
                container.appendChild(canvas);
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                renderTask = page.render(renderContext);
                renderTask.promise.then(() => {
                    renderTask = null;
                }).catch(err => {
                    if (err.name !== 'RenderingCancelled') {
                        console.error('渲染错误:', err);
                        loadingMsg.textContent = '渲染失败，请刷新重试。';
                        loadingMsg.style.display = 'block';
                    }
                });
                
                pageNumSpan.textContent = `第 ${num} / ${totalPages} 页`;
            }).catch(err => {
                console.error('获取页面失败:', err);
                loadingMsg.textContent = '页面加载失败，请检查 PDF 文件是否存在。';
            });
        }
        
        // 加载 PDF 文档
        function loadPdf() {
            loadingMsg.style.display = 'block';
            container.style.display = 'none';
            loadingMsg.textContent = '正在加载 PDF 文件，请稍候...';
            
            pdfjsLib.getDocument(pdfUrl).promise.then(doc => {
                pdfDoc = doc;
                totalPages = doc.numPages;
                currentPage = 1;
                loadingMsg.style.display = 'none';
                container.style.display = 'block';
                renderPage(currentPage);
            }).catch(err => {
                console.error('PDF 加载失败:', err);
                loadingMsg.textContent = '无法加载 PDF 文件，请确认 xianlin.pdf 是否存在于当前目录，并且文件未损坏。';
                loadingMsg.style.display = 'block';
                container.style.display = 'none';
            });
        }
        
        // 上一页
        function prevPage() {
            if (pdfDoc && currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        }
        
        // 下一页
        function nextPage() {
            if (pdfDoc && currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        }
        
        // 刷新
        function refresh() {
            loadPdf();
        }
        
        // 全屏
        function toggleFullscreen() {
            const elem = document.getElementById('pdfContainer');
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        
        // 绑定事件
        prevBtn.addEventListener('click', prevPage);
        nextBtn.addEventListener('click', nextPage);
        refreshBtn.addEventListener('click', refresh);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // 开始加载
        loadPdf();
    })();
</script>
</body>
</html>
