<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PDF预览 - xianlin.pdf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #525659;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            background: #3c3f41;
            color: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #2b2d2f;
        }
        .title {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .title a {
            color: #8bb4ff;
            text-decoration: none;
        }
        .title a:hover {
            text-decoration: underline;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        button {
            background: #5a5e62;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #767b80;
        }
        .pdf-container {
            flex: 1;
            background: #3c3f41;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fallback-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            max-width: 80%;
        }
        @media (max-width: 600px) {
            .toolbar {
                padding: 6px 12px;
            }
            button {
                padding: 3px 8px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="toolbar">
    <div class="title">
        📄 正在预览：<strong>xianlin.pdf</strong>
        <span style="font-size: 0.75rem; margin-left: 8px; color: #ccc;">(当前目录)</span>
    </div>
    <div class="controls">
        <button id="refreshBtn">⟳ 刷新</button>
        <button id="fullscreenBtn">⤢ 全屏</button>
    </div>
</div>
<div class="pdf-container" id="pdfContainer">
    <!-- 使用 iframe 嵌入 PDF，浏览器原生支持 -->
    <iframe 
        id="pdfFrame"
        src="xianlin.pdf" 
        title="PDF预览"
        allow="fullscreen"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"
    >
        您的浏览器不支持 iframe 嵌入 PDF。 
        <a href="xianlin.pdf">点击直接下载或打开文件</a>
    </iframe>
    <!-- 当浏览器不支持内嵌PDF时显示备用提示（极少见） -->
    <div class="fallback-msg" id="fallbackMsg" style="display: none;">
        ⚠️ 您的浏览器似乎无法内嵌预览PDF文件。<br>
        请点击下方链接直接查看：<br>
        <a href="xianlin.pdf" target="_blank" style="color: #8bb4ff;">打开 xianlin.pdf</a>
    </div>
</div>

<script>
    (function() {
        const iframe = document.getElementById('pdfFrame');
        const container = document.getElementById('pdfContainer');
        const fallbackMsg = document.getElementById('fallbackMsg');
        
        // 检测 iframe 是否成功加载 PDF（如果加载失败或浏览器不支持，则显示备用链接）
        // 使用 setTimeout 等待加载，检测 iframe 内容是否为空（跨域限制，只能简单判断）
        let loadFailed = false;
        
        iframe.onload = function() {
            // 某些浏览器如果无法显示 PDF 但 onload 依然会触发，我们通过检查 iframe 的内容文档长度简单辅助
            try {
                // 尝试访问 iframe 内部（同源情况下可检测，但 PDF 通常是跨域的，此处仅作降级处理）
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (doc && doc.body && doc.body.innerText.includes('无法') || 
                    (doc && doc.body && doc.body.innerText === '' && doc.body.children.length === 0)) {
                    // 表现异常，显示备用提示
                    showFallback();
                }
            } catch(e) {
                // 跨域无法检测，默认相信能正常显示。但如果用户浏览器没有 PDF 插件，则可能需要手动降级。
                // 这里使用一个简单的超时检测：如果3秒后 iframe 仍无内容且未显示，再显示备用链接（但跨域限制不可靠）
                // 更好的办法：检测 navigator.pdfViewerEnabled? 非标准。
            }
        };
        
        // 备用提示显示（当 iframe 明显不能显示时，用户可以手动调用）
        function showFallback() {
            if (fallbackMsg.style.display !== 'block') {
                fallbackMsg.style.display = 'block';
                iframe.style.opacity = '0.5';
            }
        }
        
        // 可选：检测浏览器是否支持内嵌PDF（基于 mimeTypes 和插件，不是完全可靠）
        function isPdfEmbedSupported() {
            // 简单检查 navigator 中是否有相关 mimeType
            if (navigator.mimeTypes && navigator.mimeTypes['application/pdf']) {
                return true;
            }
            // 某些移动端可能不支持，但会触发下载。我们默认显示，如果不支持再手动降级
            // 另外 Edge/Chrome 通常支持。
            return !/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);  // 移动端可能不支持内嵌预览
        }
        
        // 移动端或无法内嵌预览时，可改用直接下载链接？但保留 iframe 让系统打开。
        if (!isPdfEmbedSupported()) {
            // 移动端很多浏览器无法内嵌预览，改为显示一个较大的下载按钮替代 iframe
            iframe.style.display = 'none';
            const downloadDiv = document.createElement('div');
            downloadDiv.style.cssText = 'display:flex; align-items:center; justify-content:center; height:100%; flex-direction:column; gap:20px;';
            downloadDiv.innerHTML = `
                <div style="background:#2d2f31; padding:30px; border-radius:12px; text-align:center;">
                    <p style="margin-bottom:16px; font-size:18px;">📄 您的浏览器不支持直接内嵌预览 PDF</p>
                    <a href="xianlin.pdf" download="xianlin.pdf" style="background:#0066cc; color:white; padding:10px 20px; border-radius:6px; text-decoration:none; display:inline-block;">⬇️ 下载 PDF 文件</a>
                    <p style="margin-top:16px; font-size:13px;">或 <a href="xianlin.pdf" target="_blank" style="color:#8bb4ff;">在新标签页中打开</a></p>
                </div>
            `;
            container.innerHTML = '';
            container.appendChild(downloadDiv);
        }
        
        // 刷新按钮
        document.getElementById('refreshBtn').addEventListener('click', function() {
            if (iframe.style.display !== 'none') {
                const currentSrc = iframe.src;
                iframe.src = '';
                setTimeout(() => {
                    iframe.src = currentSrc;
                }, 50);
            } else {
                // 如果已经被替换为下载界面，则无法刷新，可重新加载页面
                location.reload();
            }
        });
        
        // 全屏按钮
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const elem = container;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        });
        
        // 延迟一小段时间，如果 iframe 加载异常则显示备用（因为某些旧浏览器无法内嵌）
        setTimeout(() => {
            // 尝试获取 iframe 内容高度为0且无有效文档时，显示备用
            try {
                const doc = iframe.contentDocument;
                if (doc && doc.body && doc.body.innerText.trim() === '' && doc.body.children.length === 0) {
                    showFallback();
                }
            } catch(e) {
                // 跨域时无法检测，假设正常
            }
        }, 2000);
    })();
</script>
</body>
</html>
